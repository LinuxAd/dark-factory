{{/* Default-deny ingress and egress in both namespaces, then only the flows
in plan Step 5. platform-project enables VPC CNI policy enforcement
(enableNetworkPolicy); `make sandbox-probe` and its CONTROL=1 negative control
show that it is live (AC4). Destinations outside the cluster that cannot be
named by hostname (Anthropic, Secrets Manager, S3, the EKS API) are 443 to
0.0.0.0/0; sandbox pods never get that rule. */}}
{{- $ns := .Release.Namespace }}
{{- $sandbox := .Values.sandboxNamespace }}
{{- range $n := list $ns $sandbox }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $n }}
  labels:
    {{- include "factory.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ $n }}
  labels:
    {{- include "factory.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
---
# Sandbox pods reach the egress proxy and the gateway, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress
  namespace: {{ $sandbox }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: smokescreen
      ports:
        - { protocol: TCP, port: 4750 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ns }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sandbox }}
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - { protocol: TCP, port: 9090 }
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: factory-db
      ports:
        - { protocol: TCP, port: 5432 }
    # Anthropic API and Secrets Manager.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
    {{- include "factory.podIdentityAgentEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smokescreen
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smokescreen
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sandbox }}
      ports:
        - { protocol: TCP, port: 4750 }
  # Smokescreen enforces the hostname allowlist and refuses private,
  # link-local and loopback addresses itself.
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 80 }
---
# Selected by cluster name so the recovery and initdb Job pods are covered as
# well as the instances, for both the chart's Cluster and the db-init seed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg
  namespace: {{ $ns }}
  labels:
    {{- include "factory.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [factory-db, factory-db-seed]
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { protocol: TCP, port: 5432 }
    # The operator: instance manager status (8000) and Postgres.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpgNamespace }}
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoringNamespace }}
      ports:
        - { protocol: TCP, port: 9187 }
  egress:
    # S3 and the Kubernetes API.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 443 }
    {{- include "factory.podIdentityAgentEgress" . | nindent 4 }}
